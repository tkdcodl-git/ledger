<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#f4f3ef">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>가계부</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--bg:#f5f7f6;--card:#fff;--ink:#16211d;--mute:#69766f;--line:#e3e9e6;--accent:#0f7b5f;--accent-soft:#e3f3ed;--warn:#b4492f}
*{box-sizing:border-box;touch-action:manipulation}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Pretendard Variable",Pretendard,-apple-system,"Malgun Gothic",sans-serif}
header{display:flex;align-items:center;gap:12px;padding:14px 24px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header h1{font-size:17px;margin:0;font-weight:700;flex:1}
button,select,input{font:inherit;color:inherit}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 14px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn:disabled{opacity:.45;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;max-width:1180px;margin:20px auto;padding:0 20px}
@media(max-width:900px){main{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px}
.panel+.panel{margin-top:16px}
h2{font-size:15px;margin:0 0 12px}
#drop{border:2px dashed #bfd3cb;border-radius:12px;padding:28px;text-align:center;color:var(--mute);cursor:pointer;background:#fafcfb}
#drop.over{border-color:var(--accent);background:var(--accent-soft)}
#drop b{color:var(--ink)}
#status{margin-top:10px;color:var(--mute);font-size:14px;min-height:20px}
#status.err{color:var(--warn)}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.bar .sp{flex:1}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;color:var(--mute);font-weight:500;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
td.neg{color:var(--warn)}
tr.new td:first-child{box-shadow:inset 3px 0 var(--accent)}
td select{border:1px solid var(--line);border-radius:6px;padding:3px 6px;background:#fff;max-width:140px}
.x{border:0;background:none;color:var(--mute);cursor:pointer;font-size:16px}
.tbl{overflow-x:auto}
.cat{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:14px}
.cat span:first-child{width:92px;flex:none}
.cat i{display:block;height:8px;border-radius:4px;background:var(--accent);opacity:.8}
.cat .v{margin-left:auto;font-variant-numeric:tabular-nums}
textarea{width:100%;min-height:150px;border:1px solid var(--line);border-radius:8px;padding:10px;resize:vertical;font:13.5px/1.6 "Pretendard Variable",sans-serif;background:#fafcfb}
.total{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.muted{color:var(--mute);font-size:13px}
.hide{display:none!important}
#prog{margin-top:12px}
.pbar{height:10px;background:var(--accent-soft);border-radius:6px;overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:var(--accent);border-radius:6px;transition:width .3s ease}
#ptxt{display:flex;justify-content:space-between;margin-top:6px;font-size:13.5px;color:var(--mute);font-variant-numeric:tabular-nums}
th{text-align:center!important}
#tabs{display:flex;gap:6px;align-items:center;max-width:1180px;margin:16px auto 0;padding:0 20px}
#tabs .sp{flex:1}
.tab{border:0;background:none;padding:8px 14px;border-radius:8px;cursor:pointer;color:var(--mute);font-weight:600}
.tab.on{background:var(--accent-soft);color:var(--accent)}
.btn.sm{padding:2px 10px;font-size:13px;margin-top:4px}
#dash{max-width:1180px;margin:16px auto 0;padding:0 20px}
.dt td{vertical-align:top;border-bottom:1px solid var(--line);padding:10px 8px}
.dt td.c{text-align:center}
.dt td.memo{white-space:pre-line;font-size:12.5px;min-width:240px;vertical-align:middle}
.mp+.mp{margin-top:4px}
.fl input[type=date],.fl input[type=month]{-webkit-appearance:none;appearance:none;display:block;width:100%;max-width:100%;min-width:0;min-height:40px;background:#fff;text-align:left}
.fl input[type=date]::-webkit-date-and-time-value,.fl input[type=month]::-webkit-date-and-time-value{text-align:left}
.ln{display:flex;justify-content:space-between;gap:14px;font-size:13px;font-variant-numeric:tabular-nums}
.dt{font-size:13px}
.ln.sum{font-weight:600}
.dt tr.sr td{padding-top:6px}
.dt tr.sr{height:1px}
/* v2.5 합계칸 높이 고정: 비고가 길어지면 항목 칸만 늘어남 */
.dt td.its{padding:0!important;height:1px}
.dt .ic{display:flex;flex-direction:column;height:100%}
.dt .il{flex:1 1 auto;padding:10px 8px 6px}
.dt .is{flex:0 0 auto;border-top:1px solid var(--line);padding:6px 8px 10px}
.lg{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mute);margin-bottom:4px}
.lg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
.dgrid .panel{margin-top:0}
@media(max-width:900px){.dgrid{grid-template-columns:1fr}}
.hb{display:flex;align-items:center;gap:8px;margin:8px 0;font-size:14px}
.hb span{width:92px;flex:none}.hb b{width:110px;flex:none;text-align:right;font-weight:500;font-variant-numeric:tabular-nums}
.track{flex:1;height:12px;background:var(--accent-soft);border-radius:6px;overflow:hidden}.track i{display:block;height:100%;background:var(--accent);border-radius:6px}
.modal{position:fixed;inset:0;background:rgba(22,33,29,.4);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
.sheet{background:var(--card);border-radius:12px;padding:20px;width:min(480px,100%);max-height:90vh;overflow:auto}
.crow{display:flex;gap:8px;margin:6px 0;align-items:center}
input,textarea{ime-mode:active}
.pinb{margin:0;white-space:nowrap}.pinb.on{background:var(--accent);border-color:var(--accent);color:#fff}
.crow input,.fl input,.fl textarea{flex:1;border:1px solid var(--line);border-radius:8px;padding:8px;min-width:0;width:100%}
.crow input[readonly]{background:#f2f5f4}
.fl{display:block;margin:12px 0;font-weight:600;font-size:14px}.fl input,.fl textarea{margin-top:4px;font-weight:400}
footer{text-align:center;color:var(--mute);font-size:12.5px;padding:8px 0 28px}
label.chk{display:flex;gap:6px;align-items:center;font-size:13.5px;color:var(--mute)}

/* Mobile layout: prioritize readable columns and horizontal scrolling on iPhone */
@media (max-width: 600px) {
  body { font-size: 13px; line-height: 1.4; }
  header { padding: 12px 12px; gap: 8px; }
  header h1 { font-size: 16px; }
  #tabs { margin: 10px auto 0; padding: 0 8px; gap: 4px; flex-wrap: wrap; }

  main { display: block; margin: 10px auto; padding: 0 8px; }
  main > div, main > aside { min-width: 0; }
  main > aside { margin-top: 10px; }
  .panel { padding: 11px; border-radius: 10px; }
  .panel + .panel { margin-top: 10px; }
  h2 { font-size: 13px; margin-bottom: 8px; }
  #drop { padding: 18px 10px; font-size: 12px; }
  .bar { gap: 6px; margin-bottom: 8px; }
  .bar .sp { flex-basis: 0; }
  .btn { padding: 5px 9px; font-size: 12px; }
  .btn.sm { padding: 2px 7px; font-size: 11px; }
  #month { max-width: 135px; }
  label.chk { font-size: 11px; gap: 4px; }
  #sameMerchant { margin: 0 2px 0 0; }
  .tbl { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .tbl table { width: 650px; table-layout: auto; font-size: 12px; }
  .tbl th, .tbl td { padding: 6px 6px; white-space: nowrap; }
  .tbl td:nth-child(2) { white-space: normal; min-width: 110px; max-width: 150px; overflow-wrap: anywhere; }
  .tbl td select { max-width: 120px; font-size: 11px; padding: 3px 4px; }
  .dt { width: 780px !important; table-layout: auto; }
  .dt th, .dt td { padding: 7px 6px; white-space: normal; }
  .dt td.memo { min-width: 180px; font-size: 11px; }
  .dt td:nth-child(1) { min-width: 82px; white-space: nowrap; }
  .dt td:nth-child(2), .dt td:nth-child(3) { min-width: 65px; white-space: nowrap; }
  .dt td:nth-child(4), .dt td:nth-child(5) { min-width: 125px; }
  .dgrid { grid-template-columns: minmax(0, 1fr); gap: 10px; margin-top: 10px; }
  .dgrid .panel { min-width: 0; }
  #lineChart { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  #lineChart svg { min-width: 520px; }
  .hb { gap: 5px; font-size: 11px; margin: 7px 0; }
  .hb span { width: 72px; overflow-wrap: anywhere; }
  .hb b { width: 104px; font-size: 10px; }
  .track { min-width: 24px; }
  .total { font-size: 22px; }
  .cat { gap: 6px; font-size: 12px; }
  .cat span:first-child { width: 82px; }
  .cat .v { font-size: 11px; }
  textarea { min-height: 120px; font-size: 12px; }
  .sheet { padding: 14px; }
  .crow { gap: 5px; }
  .crow input { padding: 7px; font-size: 12px; }
  .fl { font-size: 12px; }
  footer { padding-bottom: 20px; }
}

  #dash .dt td.memo { min-width: 0; font-size: 10px; line-height: 1.35; white-space: pre-line; overflow-wrap: anywhere; }
  #dash .dt td:nth-child(4), #dash .dt td:nth-child(5) { overflow-wrap: anywhere; }
  #dash .dt td.c { text-align: center; }
  #dash .dt .btn.sm { font-size: 10px; padding: 2px 5px; }
}


@media (max-width: 600px) {
  header { padding-left: 12px !important; }
  #tabs { padding-left: 8px !important; padding-right: 8px !important; gap: 3px !important; }
  #tabs .tab { padding: 6px 8px; font-size: 11px; }

/* v1.8 모바일(아이폰) 대시보드: 표 한 화면 맞춤 + 분류별 비중 한 줄 아래로 */
@media (max-width: 600px) {
  #dash .dt, #history .dt { font-size: 8px; }

  #dash .dt .ln, #history .dt .ln { font-size: 7.5px; gap: 6px; }

function localParseRows(rows) {
  const norm = c => String(c == null ? '' : c).replace(/\s+/g, '');
  const dateRe = /이용일|거래일|승인일|결제일|매출일|일자|날짜|일시/, merchRe1 = /가맹점|이용처|이용하신곳|상호|거래처/, merchRe2 = /이용내역|내용|적요/;
  const bad = /수수료|잔액|포인트|적립|한도|할부개월|누적/;
  const amtRes = [/이용금액|승인금액|거래금액|결제금액/, /청구금액/, /금액/];
  let hi = -1, di = -1, mi = -1, ai = -1, ci = -1;
  for (let r = 0; r < Math.min(rows.length, 40) && hi < 0; r++) {
    const cells = (rows[r] || []).map(norm);
    const d = cells.findIndex(c => dateRe.test(c));
    let m = cells.findIndex(c => merchRe1.test(c)); if (m < 0) m = cells.findIndex(c => merchRe2.test(c));
    let a = -1; for (const re of amtRes) { a = cells.findIndex(c => re.test(c) && !bad.test(c)); if (a >= 0) break; }
    if (d >= 0 && m >= 0 && a >= 0 && d !== m && m !== a) { hi = r; di = d; mi = m; ai = a; ci = cells.findIndex((c, i) => /취소|상태|구분/.test(c) && i !== di && i !== mi && i !== ai); }
  }
  if (hi < 0) { const g = guessCols(rows); if (!g) return null; di = g.di; mi = g.mi; ai = g.ai; ci = -1; hi = g.start - 1; }
  const out = []; let badN = 0;
  for (const row of rows.slice(hi + 1)) {
    if (!row || !row.some(c => norm(c))) continue;
    const merchant = String(row[mi] == null ? '' : row[mi]).trim();
    if (/합계|소계|총계|^계$|합\s*계/.test(merchant) || /합계|소계|총계/.test(norm(row[di]))) continue;
    const date = parseDateStr(row[di]); let amount = parseAmountStr(row[ai]);
    if (!date && !norm(row[di]) && amount == null) continue;
    if (!date || !merchant || amount == null) { badN++; continue; }

  }

}

function catDrag(box) {
  const rows = [...box.querySelectorAll('.crow[data-row]')];
  rows.forEach(row => {
    let timer = null, on = false, sy = 0, sx = 0, y0 = 0;
    const start = (x, y, target) => {
      if (target.closest('button') || (target.matches('input') && target === document.activeElement)) return;
      sx = x; sy = y; clearTimeout(timer);
      timer = setTimeout(() => { on = true; y0 = y; if (document.activeElement) document.activeElement.blur(); row.classList.add('drag'); box.classList.add('dragging'); navigator.vibrate && navigator.vibrate(15); }, 350);
    };
    const move = (x, y, e) => {
      if (!on) { if (Math.abs(y - sy) > 8 || Math.abs(x - sx) > 8) clearTimeout(timer); return; }
      e.preventDefault();
      row.style.transform = `translateY(${y - y0}px)`;
      const sibs = [...box.querySelectorAll('.crow[data-row]')].filter(r => r !== row);
      const next = sibs.find(r => { const b = r.getBoundingClientRect(); return y < b.top + b.height / 2; });
      const before = row.getBoundingClientRect().top;
      if (next) { if (next !== row.nextElementSibling) next.before(row); } else if (sibs.length && sibs[sibs.length - 1].nextElementSibling !== row) sibs[sibs.length - 1].after(row);
      y0 += row.getBoundingClientRect().top - before; // 자리가 바뀐 만큼 보정해서 손가락 아래에 유지
      row.style.transform = `translateY(${y - y0}px)`;
    };
    const end = () => {
      clearTimeout(timer); if (!on) return; on = false;
      const order = [...box.querySelectorAll('.crow[data-row]')].map(r => catRows[+r.dataset.row]);
      catRows = order; renderCats();
    };
    row.addEventListener('touchstart', e => start(e.touches[0].clientX, e.touches[0].clientY, e.target), { passive: true });
    row.addEventListener('touchmove', e => move(e.touches[0].clientX, e.touches[0].clientY, e), { passive: false });
    row.addEventListener('touchend', end); row.addEventListener('touchcancel', end);
    row.addEventListener('mousedown', e => { start(e.clientX, e.clientY, e.target);
      const mm = ev => move(ev.clientX, ev.clientY, ev), mu = () => { end(); removeEventListener('mousemove', mm); removeEventListener('mouseup', mu); };

// 서버가 제한시간 안에 응답하지 못하면 그 구간을 반으로 나눠 자동으로 다시 시도

  const pts = vals.map((v, i) => `${x(i)},${y(v)}`).join(' ');

// 잔액 자동 계산: 전월 잔액 + 수입 − (전월 카드값 + 그 밖의 지출)

async function saveLedger() {

}

// 좌우 스와이프로 탭 이동 (대시보드 ↔ 거래 내역 ↔ 전체 누적)
(() => {
  const order = ['dash', 'tx', 'history', 'cats'];
  let sx = 0, sy = 0, st = 0, ok = false;
  const hScroll = el => { for (; el && el !== document.body; el = el.parentElement) { const o = getComputedStyle(el).overflowX; if ((o === 'auto' || o === 'scroll') && el.scrollWidth > el.clientWidth + 1) return true; } return false; };
  document.addEventListener('touchstart', e => {
    const t = e.touches[0]; sx = t.clientX; sy = t.clientY; st = Date.now();
    ok = e.touches.length === 1 && $('modal').classList.contains('hide') && !e.target.closest('input,textarea,select') && !hScroll(e.target);
  }, { passive: true });
  document.addEventListener('touchend', e => {
    if (!ok) return; ok = false;
    const t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 2 || Date.now() - st > 800) return;
    const cur = order.indexOf(curTab), nx = order[cur + (dx < 0 ? 1 : -1)];
    if (cur < 0 || !nx || (nx === 'cats' && !window.matchMedia('(max-width:600px)').matches)) return;
    showTab(nx); window.scrollTo(0, 0);
  }, { passive: true });
})();

};
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeModal(); $('catPick').classList.add('hide'); } });
// 분류 선택: 기본 콤보박스 대신 모든 분류가 한 번에 보이는 선택창 (스크롤 없음)
let cpSel = null;
$('rows').addEventListener('click', e => {
  const td = e.target.closest('td.category'); if (!td) return;
  const sel = td.querySelector('select[data-h]'); if (!sel) return;
  e.preventDefault(); cpSel = sel;
  const t = txs.find(x => x.hash === sel.dataset.h);
  $('cpTitle').textContent = t ? t.merchant : '분류 선택';
  $('cpGrid').innerHTML = [...sel.options].map(o => `<button class="cpb${o.selected ? ' on' : ''}" data-cpv="${esc(o.value)}">${esc(o.textContent)}</button>`).join('');
  $('catPick').classList.remove('hide');
});
$('catPick').onclick = e => {
  const v = e.target.dataset.cpv;
  if (v != null && cpSel) { if (cpSel.value !== v) { cpSel.value = v; cpSel.dispatchEvent(new Event('change', { bubbles: true })); } }
  if (v != null || e.target === $('catPick') || 'cpclose' in e.target.dataset) $('catPick').classList.add('hide');
};
$('catsView').onclick = e => {
  const d = e.target.dataset;
  if (e.target.id === 'addCat') { const v = $('newCat').value.trim(); if (!v) return; if (catRows.some(r => r.name === v)) return renderCats('이미 있는 분류예요.'); catRows.push({ orig: null, name: v }); return renderCats(); }
  if (d.cup || d.cdn) { const i = +(d.cup || d.cdn), j = d.cup ? i - 1 : i + 1; if (j < 0 || j >= catRows.length) return; [catRows[i], catRows[j]] = [catRows[j], catRows[i]]; return renderCats(); }
  if (d.cdel) { catRows.splice(+d.cdel, 1); return renderCats(); }
  if (e.target.id === 'catSave') return saveCats();
};
$('catsView').oninput = e => { const d = e.target.dataset; if (d.ci != null) catRows[+d.ci].name = e.target.value; };

if (sb) loadAll();
</script>
</body>
</html>
