<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>가계부</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--bg:#f5f7f6;--card:#fff;--ink:#16211d;--mute:#69766f;--line:#e3e9e6;--accent:#0f7b5f;--accent-soft:#e3f3ed;--warn:#b4492f}
*{box-sizing:border-box;touch-action:manipulation}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Pretendard Variable",Pretendard,-apple-system,"Malgun Gothic",sans-serif}
header{display:flex;align-items:center;gap:12px;padding:14px 24px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header h1{font-size:17px;margin:0;font-weight:700;flex:1}
button,select,input{font:inherit;color:inherit}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 14px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn:disabled{opacity:.45;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;max-width:1180px;margin:20px auto;padding:0 20px}
@media(max-width:900px){main{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px}
.panel+.panel{margin-top:16px}
h2{font-size:15px;margin:0 0 12px}
#drop{border:2px dashed #bfd3cb;border-radius:12px;padding:28px;text-align:center;color:var(--mute);cursor:pointer;background:#fafcfb}
#drop.over{border-color:var(--accent);background:var(--accent-soft)}
#drop b{color:var(--ink)}
#status{margin-top:10px;color:var(--mute);font-size:14px;min-height:20px}
#status.err{color:var(--warn)}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.bar .sp{flex:1}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;color:var(--mute);font-weight:500;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
td.neg{color:var(--warn)}
tr.new td:first-child{box-shadow:inset 3px 0 var(--accent)}
td select{border:1px solid var(--line);border-radius:6px;padding:3px 6px;background:#fff;max-width:140px}
.x{border:0;background:none;color:var(--mute);cursor:pointer;font-size:16px}
.tbl{overflow-x:auto}
.cat{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:14px}
.cat span:first-child{width:92px;flex:none}
.cat i{display:block;height:8px;border-radius:4px;background:var(--accent);opacity:.8}
.cat .v{margin-left:auto;font-variant-numeric:tabular-nums}
textarea{width:100%;min-height:150px;border:1px solid var(--line);border-radius:8px;padding:10px;resize:vertical;font:13.5px/1.6 "Pretendard Variable",sans-serif;background:#fafcfb}
.total{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.muted{color:var(--mute);font-size:13px}
.hide{display:none!important}
#prog{margin-top:12px}
.pbar{height:10px;background:var(--accent-soft);border-radius:6px;overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:var(--accent);border-radius:6px;transition:width .3s ease}
#ptxt{display:flex;justify-content:space-between;margin-top:6px;font-size:13.5px;color:var(--mute);font-variant-numeric:tabular-nums}
th{text-align:center!important}
#tabs{display:flex;gap:6px;align-items:center;max-width:1180px;margin:16px auto 0;padding:0 20px}
#tabs .sp{flex:1}
.tab{border:0;background:none;padding:8px 14px;border-radius:8px;cursor:pointer;color:var(--mute);font-weight:600}
.tab.on{background:var(--accent-soft);color:var(--accent)}
.btn.sm{padding:2px 10px;font-size:13px;margin-top:4px}
#dash{max-width:1180px;margin:16px auto 0;padding:0 20px}
.dt td{vertical-align:top;border-bottom:1px solid var(--line);padding:10px 8px}
.dt td.c{text-align:center}
.dt td.memo{white-space:pre-line;font-size:12.5px;min-width:240px;vertical-align:middle}
.mp+.mp{margin-top:4px}
.fl input[type=date],.fl input[type=month]{-webkit-appearance:none;appearance:none;display:block;width:100%;max-width:100%;min-width:0;min-height:40px;background:#fff;text-align:left}
.fl input[type=date]::-webkit-date-and-time-value,.fl input[type=month]::-webkit-date-and-time-value{text-align:left}
.ln{display:flex;justify-content:space-between;gap:14px;font-size:13px;font-variant-numeric:tabular-nums}
.dt{font-size:13px}
.ln.sum{font-weight:600}
.dt tr.sr td{padding-top:6px}
.dt tr.sr{height:1px}
.lg{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mute);margin-bottom:4px}
.lg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
.dgrid .panel{margin-top:0}
@media(max-width:900px){.dgrid{grid-template-columns:1fr}}
.hb{display:flex;align-items:center;gap:8px;margin:8px 0;font-size:14px}
.hb span{width:92px;flex:none}.hb b{width:110px;flex:none;text-align:right;font-weight:500;font-variant-numeric:tabular-nums}
.track{flex:1;height:12px;background:var(--accent-soft);border-radius:6px;overflow:hidden}.track i{display:block;height:100%;background:var(--accent);border-radius:6px}
.modal{position:fixed;inset:0;background:rgba(22,33,29,.4);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
.sheet{background:var(--card);border-radius:12px;padding:20px;width:min(480px,100%);max-height:90vh;overflow:auto}
.crow{display:flex;gap:8px;margin:6px 0;align-items:center}
input,textarea{ime-mode:active}
.pinb{margin:0;white-space:nowrap}.pinb.on{background:var(--accent);border-color:var(--accent);color:#fff}
.crow input,.fl input,.fl textarea{flex:1;border:1px solid var(--line);border-radius:8px;padding:8px;min-width:0;width:100%}
.crow input[readonly]{background:#f2f5f4}
.fl{display:block;margin:12px 0;font-weight:600;font-size:14px}.fl input,.fl textarea{margin-top:4px;font-weight:400}
footer{text-align:center;color:var(--mute);font-size:12.5px;padding:8px 0 28px}
label.chk{display:flex;gap:6px;align-items:center;font-size:13.5px;color:var(--mute)}

/* Mobile layout: prioritize readable columns and horizontal scrolling on iPhone */
@media (max-width: 600px) {
  body { font-size: 13px; line-height: 1.4; }
  header { padding: 12px 12px; gap: 8px; }
  header h1 { font-size: 16px; }
  #tabs { margin: 10px auto 0; padding: 0 8px; gap: 4px; flex-wrap: wrap; }

  main { display: block; margin: 10px auto; padding: 0 8px; }

  .panel { padding: 11px; border-radius: 10px; }

  h2 { font-size: 13px; margin-bottom: 8px; }
  #drop { padding: 18px 10px; font-size: 12px; }
  .bar { gap: 6px; margin-bottom: 8px; }
  .bar .sp { flex-basis: 0; }
  .btn { padding: 5px 9px; font-size: 12px; }
  .btn.sm { padding: 2px 7px; font-size: 11px; }
  #month { max-width: 135px; }
  label.chk { font-size: 11px; gap: 4px; }
  #sameMerchant { margin: 0 2px 0 0; }
  .tbl { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .tbl table { width: 650px; table-layout: auto; font-size: 12px; }
  .tbl th, .tbl td { padding: 6px 6px; white-space: nowrap; }
  .tbl td:nth-child(2) { white-space: normal; min-width: 110px; max-width: 150px; overflow-wrap: anywhere; }
  .tbl td select { max-width: 120px; font-size: 11px; padding: 3px 4px; }
  .dt { width: 780px !important; table-layout: auto; }
  .dt th, .dt td { padding: 7px 6px; white-space: normal; }
  .dt td.memo { min-width: 180px; font-size: 11px; }
  .dt td:nth-child(1) { min-width: 82px; white-space: nowrap; }
  .dt td:nth-child(2), .dt td:nth-child(3) { min-width: 65px; white-space: nowrap; }
  .dt td:nth-child(4), .dt td:nth-child(5) { min-width: 125px; }
  .dgrid { grid-template-columns: minmax(0, 1fr); gap: 10px; margin-top: 10px; }
  .dgrid .panel { min-width: 0; }
  #lineChart { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  #lineChart svg { min-width: 520px; }
  .hb { gap: 5px; font-size: 11px; margin: 7px 0; }
  .hb span { width: 72px; overflow-wrap: anywhere; }
  .hb b { width: 104px; font-size: 10px; }
  .track { min-width: 24px; }
  .total { font-size: 22px; }
  .cat { gap: 6px; font-size: 12px; }
  .cat span:first-child { width: 82px; }
  .cat .v { font-size: 11px; }
  textarea { min-height: 120px; font-size: 12px; }
  .sheet { padding: 14px; }
  .crow { gap: 5px; }
  .crow input { padding: 7px; font-size: 12px; }
  .fl { font-size: 12px; }
  footer { padding-bottom: 20px; }
}


@media (max-width: 600px) {
  /* Compact transaction table: date, merchant, category, amount, delete */
  #app .tbl table:not(.dt) { width: 100%; min-width: 0; table-layout: fixed; font-size: 11px; }
  #app .tbl table:not(.dt) th, #app .tbl table:not(.dt) td {
    padding: 5px 3px; white-space: normal; vertical-align: middle;
  }
  #app .tbl table:not(.dt) th:nth-child(1), #app .tbl table:not(.dt) td.txdate { width: 45px; white-space: nowrap; }

    width: 78px; max-width: 78px; overflow-wrap: anywhere;
  }

  }

  /* Dashboard monthly table: compact spreadsheet-like layout, mobile only */

  #dash .dt th:nth-child(3), #dash .dt td:nth-child(3) { width: 48px; }
  #dash .dt th:nth-child(4), #dash .dt td:nth-child(4) { width: 125px; }

  #dash .dt th:nth-child(6), #dash .dt td:nth-child(6) { width: 260px; }
  #dash .dt td.memo { min-width: 0; font-size: 10px; line-height: 1.35; white-space: pre-line; overflow-wrap: anywhere; }
  #dash .dt td:nth-child(4), #dash .dt td:nth-child(5) { overflow-wrap: anywhere; }
  #dash .dt td.c { text-align: center; }
  #dash .dt .btn.sm { font-size: 10px; padding: 2px 5px; }
}


@media (max-width: 600px) {
  header { padding-left: 12px !important; }
  #tabs { padding-left: 8px !important; padding-right: 8px !important; gap: 3px !important; }
  #tabs .tab { padding: 6px 8px; font-size: 11px; }
  #tabs .btn { padding: 5px 7px; font-size: 11px; }
  main { padding-left: 6px !important; padding-right: 6px !important; }
  #app .tbl table:not(.dt) { width: 100%; min-width: 0; table-layout: fixed; font-size: 10px; }
  #app .tbl table:not(.dt) th, #app .tbl table:not(.dt) td { padding: 4px 2px; }

  #dash, #history { margin: 8px auto 0; padding: 0 6px; }

/* v1.8 모바일(아이폰) 대시보드: 표 한 화면 맞춤 + 분류별 비중 한 줄 아래로 */
@media (max-width: 600px) {
  #dash .dt, #history .dt { font-size: 8px; }
  #dash .dt th, #history .dt th { font-size: 8px; font-weight: 500; }
  #dash .dt td, #history .dt td { min-width: 0 !important; }
  #dash .dt th:nth-child(1), #dash .dt td:nth-child(1), #history .dt th:nth-child(1), #history .dt td:nth-child(1) { width: 38px; }
  #dash .dt th:nth-child(2), #dash .dt td:nth-child(2), #history .dt th:nth-child(2), #history .dt td:nth-child(2) { width: 30px; }
  #dash .dt th:nth-child(3), #dash .dt td:nth-child(3), #history .dt th:nth-child(3), #history .dt td:nth-child(3) { width: 32px; }
  #dash .dt th:nth-child(4), #dash .dt td:nth-child(4), #history .dt th:nth-child(4), #history .dt td:nth-child(4) { width: 72px; }
  #dash .dt th:nth-child(5), #dash .dt td:nth-child(5), #history .dt th:nth-child(5), #history .dt td:nth-child(5) { width: 72px; }
  #dash .dt td.memo, #history .dt td.memo { font-size: 8px; line-height: 1.3; }
  #dash .dt .ln, #history .dt .ln { font-size: 9px; font-weight: 400; gap: 3px; line-height: 1.25; }
  #dash .dt .ln span, #history .dt .ln span { min-width: 0; overflow-wrap: anywhere; }
  #dash .dt .ln b, #history .dt .ln b { font-weight: 400; font-size: 9px; flex: none; white-space: nowrap; }
  #dash .dt .ln.sum, #history .dt .ln.sum { margin: 0; padding: 0; }
  #dash .dt .ln.sum b, #history .dt .ln.sum b { font-weight: 600; }
  #dash .dt td:nth-child(2), #dash .dt td:nth-child(3), #history .dt td:nth-child(2), #history .dt td:nth-child(3) { font-size: 8px; }

  /* 최근 6개월 카드값 / 분류별 비중: 세로로 한 줄씩 */

  #dash #lineChart svg { height: auto; }
  #dash #lineChart .muted { font-size: 10px; }
  #dash .bar { gap: 8px; }
  #dash #catMonth { max-width: none; padding: 4px 8px; font-size: 12px; }
  #dash .hb { gap: 6px; font-size: 12px; margin: 7px 0; }
  #dash .hb span { width: 78px; font-size: 12px; }
  #dash .hb b { width: 92px; font-size: 11px; }
  #dash .track { min-width: 20px; }
  #dash .muted { font-size: 10px; }

  /* v1.9 표 가독성: 열 구분선 + 여백, 비고 세로 가운데 */
  #dash .dt th, #history .dt th { padding: 5px 4px; }
  #dash .dt td, #history .dt td { padding: 7px 4px; }
  #dash .dt th:nth-child(n+2), #dash .dt td:nth-child(n+2), #history .dt th:nth-child(n+2), #history .dt td:nth-child(n+2) { border-left: 1px solid #e6ebe9; }
  #dash .dt th:nth-child(1), #dash .dt td:nth-child(1), #history .dt th:nth-child(1), #history .dt td:nth-child(1) { width: 40px; }
  #dash .dt th:nth-child(2), #dash .dt td:nth-child(2), #history .dt th:nth-child(2), #history .dt td:nth-child(2) { width: 32px; }
  #dash .dt th:nth-child(3), #dash .dt td:nth-child(3), #history .dt th:nth-child(3), #history .dt td:nth-child(3) { width: 34px; }
  #dash .dt th:nth-child(4), #dash .dt td:nth-child(4), #history .dt th:nth-child(4), #history .dt td:nth-child(4) { width: 78px; }
  #dash .dt th:nth-child(5), #dash .dt td:nth-child(5), #history .dt th:nth-child(5), #history .dt td:nth-child(5) { width: 78px; }
  #dash .dt .ln, #history .dt .ln { font-size: 7.5px; gap: 6px; }
  #dash .dt .ln b, #history .dt .ln b { font-size: 7.5px; }
  #dash .dt td.memo, #history .dt td.memo { vertical-align: middle; font-size: 7px; line-height: 1.2; }

  /* v2.0 합계 행 최하단 고정 + 상단 메뉴 여백 */
  #dash .dt tr.r1 td.its, #history .dt tr.r1 td.its { padding-bottom: 5px; }
  #dash .dt tr.sr td, #history .dt tr.sr td { padding-top: 5px; padding-bottom: 7px; border-left: 1px solid #e6ebe9; }
  #tabs { margin-top: 22px !important; } /* 아이폰 상단 흐림 구간을 피하는 최소 여백 */

  /* v2.2 표 전체 7px, 년월 최소 너비, 헤더·합계 행 높이 축소 */
  #dash .dt, #history .dt { font-size: 7px; }

<script>

const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZrc3RieXV2em9xaGJmYnl6cnZhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI0NjExMjQsImV4cCI6MjEwODAzNzEyNH0.mE7V6V6zcVIlMcKdOBoJiqJbHHeQ0NEiSb40y7p80U4';
// 버전 규칙: 변경할 때마다 0.1 증가, v1.9 다음은 v2.0
const APP_VERSION = 'v3.0';
const DEFAULT_CATS = ['마트/반찬','백화점/외식','카페/간식','주유/교통','병원/약국','관리비/공과금','통신/구독','쇼핑','여행/숙소','교육/육아','경조사/선물','기타'];
let CATS = DEFAULT_CATS.slice();
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const won = n => n.toLocaleString('ko-KR');
const man = n => (Math.round(n / 1000) / 10).toString();

$('ver').textContent = APP_VERSION;
let sb;
let txs = [], rules = [], removed = new Set(), rulesDirty = new Set(), monthInit = false;

try { sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY); } catch (e) { setStatus('Supabase 설정을 확인하세요: ' + e.message, true); }

function setStatus(t, err) { const s = $('status'); s.textContent = t; s.className = err ? 'err' : ''; }

// ---------- 데이터 ----------
async function loadAll() {
  const [t, r, st, lg] = await Promise.all([
    sb.from('transactions').select('*').order('tx_date', { ascending: false }).limit(5000),
    sb.from('rules').select('keyword,category'),

    sb.from('ledger').select('*')
  ]);
  if (st.error || lg.error) setStatus('설정/월 정보 테이블이 없어요. supabase/schema.sql을 다시 실행하세요.', true);
  else {
    const c = (st.data || []).find(x => x.key === 'categories');
    if (c && Array.isArray(c.value) && c.value.length) CATS = c.value;
    ledger = {}; (lg.data || []).forEach(x => ledger[x.month] = x.data);
    const f = (st.data || []).find(x => x.key === 'fixed'), mt = (st.data || []).find(x => x.key === 'memoTemplate');
    if (f && f.value) fixed = { income: f.value.income || [], expense: f.value.expense || [] };
    memoTpl = mt && mt.value ? (mt.value.text || '') : '';
  }
  if (t.error) return setStatus('불러오기 실패: ' + t.error.message, true);
  txs = t.data.map(x => ({ hash: x.hash, date: x.tx_date, merchant: x.merchant, amount: x.amount, category: x.category, saved: true }));
  rules = (r.data || []);
  refresh();
}
function ruleFor(m) {
  const hit = rules.filter(r => m.includes(r.keyword)).sort((a, b) => b.keyword.length - a.keyword.length)[0];
  return hit && hit.category;
}
async function save() {
  const rows = txs.filter(t => !t.saved).map(t => ({ hash: t.hash, tx_date: t.date, merchant: t.merchant, amount: t.amount, category: t.category }));
  const rl = rules.filter(r => rulesDirty.has(r.keyword));
  let err;
  if (rows.length) err = (await sb.from('transactions').upsert(rows, { onConflict: 'hash' })).error;
  if (!err && rl.length) err = (await sb.from('rules').upsert(rl, { onConflict: 'keyword' })).error;
  if (!err && removed.size) err = (await sb.from('transactions').delete().in('hash', [...removed])).error;
  if (err) return setStatus('저장 실패: ' + err.message, true);
  txs.forEach(t => t.saved = true); removed.clear(); rulesDirty.clear();
  setStatus('저장했어요.'); refresh();
}
$('save').onclick = save;

// ---------- 업로드 ----------
const drop = $('drop');
drop.onclick = () => $('file').click();
drop.onkeydown = e => { if (e.key === 'Enter') $('file').click(); };
drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
drop.ondragleave = () => drop.classList.remove('over');
drop.ondrop = e => { e.preventDefault(); drop.classList.remove('over'); handle([...e.dataTransfer.files]); };
$('file').onchange = e => { const fl = Array.from(e.target.files); e.target.value = ''; handle(fl); };

const b64 = blob => new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result.split(',')[1]); r.readAsDataURL(blob); });

const isCsv = f => /\.csv$/i.test(f.name) || f.type === 'text/csv';
async function readText(file) {
  const buf = await file.arrayBuffer();
  try { return new TextDecoder('utf-8', { fatal: true }).decode(buf); }
  catch { return new TextDecoder('euc-kr').decode(buf); } // 카드사 CSV는 EUC-KR인 경우가 많음
}
const isXls = f => /\.xlsx?$/i.test(f.name);
function csvChunks(text) {
  const lines = text.split(/\r?\n/).filter(l => l.replace(/[,\s"]/g, ''));
  const head = lines[0], out = [];
  for (let i = 1; i < lines.length; i += 80) out.push({ text: [head, ...lines.slice(i, i + 80)].join('\n') }); // 구간이 작을수록 서버 제한시간 안에 끝나요
  return out.length ? out : [{ text: lines.join('\n') }];
}
async function toChunks(file) {
  if (isCsv(file)) return csvChunks(await readText(file));
  if (isXls(file)) {
    if (typeof XLSX === 'undefined') throw new Error('엑셀 라이브러리를 불러오지 못했어요. 새로고침 후 다시 시도하세요.');
    const wb = XLSX.read(await file.arrayBuffer(), { type: 'array' });
    const text = wb.SheetNames.map(n => XLSX.utils.sheet_to_csv(wb.Sheets[n])).join('\n');
    return csvChunks(text);
  }
  if (file.type === 'application/pdf') return [{ media_type: 'application/pdf', data: await b64(file) }];
  const bmp = await createImageBitmap(file);
  const s = Math.min(1, 1100 / bmp.width), W = Math.round(bmp.width * s), H = Math.round(bmp.height * s);
  const step = 1200, out = [];
  for (let y = 0; y < H; y += step) {
    const h = Math.min(step, H - y), c = document.createElement('canvas');
    c.width = W; c.height = h;
    c.getContext('2d').drawImage(bmp, 0, y / s, bmp.width, h / s, 0, 0, W, h);
    out.push({ media_type: 'image/jpeg', data: c.toDataURL('image/jpeg', 0.85).split(',')[1] });
  }
  return out;
}

async function analyze(chunk) {
  const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 90000);
  try {
    const r = await fetch('/api/analyze', {
      method: 'POST', signal: ctl.signal,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ...chunk, categories: CATS })
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || ('서버 오류 ' + r.status + (r.status === 504 ? ' (시간 초과)' : '')));
    return j.transactions;
  } catch (e) {
    throw new Error(e.name === 'AbortError' ? '응답이 90초 넘게 오지 않아 중단했어요. 다시 시도해보세요.' : e.message);
  } finally { clearTimeout(timer); }
}

// 서버가 제한시간 안에 응답하지 못하면 그 구간을 반으로 나눠 자동으로 다시 시도
async function splitChunk(c) {
  if (c.text) {
    const lines = c.text.split('\n'), head = lines[0], body = lines.slice(1);
    if (body.length < 16) return null;
    const mid = Math.ceil(body.length / 2);
    return [{ text: [head, ...body.slice(0, mid)].join('\n') }, { text: [head, ...body.slice(mid)].join('\n') }];
  }
  if (c.media_type === 'image/jpeg') {
    const bmp = await createImageBitmap(await (await fetch('data:image/jpeg;base64,' + c.data)).blob());
    if (bmp.height < 600) return null;
    const h1 = Math.floor(bmp.height / 2), h2 = bmp.height - h1;
    const cut = (y, h) => { const cv = document.createElement('canvas'); cv.width = bmp.width; cv.height = h; cv.getContext('2d').drawImage(bmp, 0, y, bmp.width, h, 0, 0, bmp.width, h); return { media_type: 'image/jpeg', data: cv.toDataURL('image/jpeg', 0.85).split(',')[1] }; };
    return [cut(0, h1), cut(h1, h2)];
  }
  return null; // PDF는 나눌 수 없음
}
const isTimeout = e => /초|시간 초과|504|timeout/i.test((e && e.message) || '');
async function analyzeSplit(c, depth = 0, tries = 0) {
  try { return await analyze(c); }
  catch (e) {
    // 무료 사용 한도(429)면 잠시 기다렸다가 같은 구간을 다시 시도
    if (/한도|429/.test((e && e.message) || '') && tries < 3) {
      const keep = prog.msg; prog.msg = 'AI 사용 한도 대기 중';
      await new Promise(r => setTimeout(r, 20000));
      prog.msg = keep;
      return analyzeSplit(c, depth, tries + 1);
    }
    if (!isTimeout(e) || depth >= 3) throw e;
    const parts = await splitChunk(c);
    if (!parts) throw e;
    const out = [];
    for (const p of parts) out.push(...await analyzeSplit(p, depth + 1));
    return out;
  }
}

// 진행바: 단계가 끝날 때마다 올라가고, 응답을 기다리는 동안에도 천천히 차오름
const prog = { total: 0, done: 0, inflight: 0, start: 0, timer: null, msg: '' };
function progDraw() {
  const el = (Date.now() - prog.start) / 1000;
  const frac = 0.9 * (1 - Math.exp(-el / 25)); // 진행 중인 요청은 최대 90%까지만
  const pct = Math.min(99, Math.round(5 + 95 * (prog.done + prog.inflight * frac) / prog.total));
  $('pfill').style.width = pct + '%';
  $('ppct').textContent = pct + '%';
  $('pmsg').textContent = `${prog.msg} · ${prog.done}/${prog.total} 완료 · ${Math.round((Date.now() - prog.t0) / 1000)}초 경과`;
}
function progStart(total, msg) {
  Object.assign(prog, { total, done: 0, inflight: 0, start: Date.now(), t0: Date.now(), msg });
  $('prog').classList.remove('hide'); progDraw();
  clearInterval(prog.timer); prog.timer = setInterval(progDraw, 250);
}
function progEnd() { clearInterval(prog.timer); $('pmsg').textContent = `분석 완료 · ${Math.round((Date.now() - prog.t0) / 1000)}초`; $('pfill').style.width = '100%'; $('ppct').textContent = '100%'; setTimeout(() => $('prog').classList.add('hide'), 1200); }

async function handle(files) {
  setStatus(`파일 ${files.length}개를 읽는 중…`);
  files = files.filter(f => f.type.startsWith('image/') || f.type === 'application/pdf' || isCsv(f) || isXls(f));
  if (!files.length) return setStatus('이미지, PDF, CSV, 엑셀 파일만 올릴 수 있어요.', true);
  try {
    let chunks = [];
    for (const f of files) chunks.push(...await toChunks(f));
    setStatus('');
    progStart(chunks.length, 'AI가 내역을 읽는 중');
    let all = [], fails = [];
    for (let i = 0; i < chunks.length; i += 3) {
      const batch = chunks.slice(i, i + 3);
      prog.inflight = batch.length; prog.start = Date.now();
      const part = await Promise.all(batch.map(c => analyzeSplit(c).catch(e => { fails.push(e.message); return []; }).then(r => { prog.done++; prog.inflight--; return r; })));
      part.forEach(p => all.push(...p));
    }
    progEnd();
    const seen = {}, existing = new Set(txs.map(t => t.hash));
    let added = 0;
    for (const t of all) {
      const base = `${t.date}|${t.merchant}|${t.amount}`;
      seen[base] = (seen[base] || 0) + 1;
      const hash = base + '|' + seen[base];
      if (existing.has(hash)) continue;
      txs.push({ hash, date: t.date, merchant: t.merchant, amount: t.amount, category: ruleFor(t.merchant) || (CATS.includes(t.category) ? t.category : '기타'), saved: false, fresh: true });
      added++;
    }
    refresh();
    if (fails.length) setStatus(`${fails.length}개 구간 실패: ${fails[0]} (읽은 ${all.length}건은 추가했어요)`, true);

let ledger = {}, catRows = [], led = null, dashCatMonth = '', fixed = { income: [], expense: [] }, memoTpl = '', downOnBackdrop = false;
const num = v => { const x = parseFloat(String(v).replace(/,/g, '')); return isFinite(x) ? x : 0; };
const mm = n => (Math.round(n * 10) / 10).toLocaleString('ko-KR');
const monthAdd = (m, d) => { let [y, o] = m.split('-').map(Number); o += d; y += Math.floor((o - 1) / 12); o = ((o - 1) % 12 + 12) % 12 + 1; return y + '-' + String(o).padStart(2, '0'); };
const nowMonth = () => { const n = new Date(); return n.getFullYear() + '-' + String(n.getMonth() + 1).padStart(2, '0'); };

function cardByMonth() {

function trendSVG(labels, data) {
  const mob = window.matchMedia('(max-width:600px)').matches;
  const W = mob ? 340 : 560, H = mob ? 160 : 210, pl = 38, pr = 10, pt = 22, pb = 26;
  const all = data.flatMap(d => [d.bal, d.inc, d.exp]).filter(v => v != null);
  const max = Math.max(10, ...all) * 1.12, n = labels.length, step = (W - pl - pr) / n;
  const cx = i => pl + step * (i + 0.5), y = v => pt + (H - pt - pb) * (1 - v / max), base = y(0);
  const halo = 'stroke="#fff" stroke-width="3" paint-order="stroke"';
  let g = '';
  for (let k = 0; k <= 4; k++) { const v = max * k / 4; g += `<line x1="${pl}" x2="${W - pr}" y1="${y(v)}" y2="${y(v)}" stroke="#e3e9e6"/><text x="${pl - 6}" y="${y(v) + 4}" text-anchor="end" font-size="10" fill="#69766f">${Math.round(v)}</text>`; }
  const bw = Math.min(30, step * 0.55);
  const bars = data.map((d, i) => {
    if (d.bal == null) return '';
    const top = y(Math.max(d.bal, 0)), h = base - top;
    return `<rect x="${cx(i) - bw / 2}" y="${top}" width="${bw}" height="${h}" rx="3" fill="url(#gBal)"/><text x="${cx(i)}" y="${h >= 14 ? base - 4 : top - 4}" text-anchor="middle" font-size="9" fill="#1f6f68">${mm(d.bal)}</text>`;
  }).join('');
  const line = (key, color) => {
    const pts = data.map((d, i) => d[key] == null ? null : [cx(i), y(d[key])]).filter(Boolean);
    return (pts.length > 1 ? `<polyline points="${pts.map(p => p.join(',')).join(' ')}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linejoin="round"/>` : '') + pts.map(p => `<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="${color}"/>`).join('');
  };
  const lbl = data.map((d, i) => {
    const up = d.inc != null && d.exp != null ? d.inc >= d.exp : true; // 값이 큰 쪽 라벨은 위, 작은 쪽은 아래
    let s = '';
    if (d.inc != null) s += `<text x="${cx(i)}" y="${y(d.inc) + (up ? -7 : 14)}" text-anchor="middle" font-size="9" fill="#2c8f87" ${halo}>${mm(d.inc)}</text>`;
    if (d.exp != null) s += `<text x="${cx(i)}" y="${y(d.exp) + (up ? 14 : -7)}" text-anchor="middle" font-size="9" fill="#c4465a" ${halo}>${mm(d.exp)}</text>`;
    return s;
  }).join('');
  const xl = labels.map((l, i) => `<text x="${cx(i)}" y="${H - 9}" text-anchor="middle" font-size="10" fill="#69766f">${l}</text>`).join('');
  return `<div class="lg"><span><i style="background:linear-gradient(#5ab9aa,#47a3de);opacity:.6"></i>잔액</span><span><i style="background:#52b5ad"></i>수입 합계</span><span><i style="background:#e0687a"></i>지출 합계</span></div><svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="최근 6개월 잔액, 수입, 지출(만원)"><defs><linearGradient id="gBal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5ab9aa" stop-opacity=".55"/><stop offset="1" stop-color="#47a3de" stop-opacity=".35"/></linearGradient></defs>${g}${bars}${line('inc', '#52b5ad')}${line('exp', '#e0687a')}${lbl}${xl}</svg>`;
}
function lineSVG(labels, vals, compact = false) {
  const W = compact && window.matchMedia('(max-width:600px)').matches ? 340 : 560, H = compact ? 150 : 240, pl = 40, pr = 14, pt = 18, pb = 24, max = Math.max(1, ...vals) * 1.15;
  const x = i => pl + i * (W - pl - pr) / (vals.length - 1), y = v => pt + (H - pt - pb) * (1 - v / max);
  let g = '';
  for (let k = 0; k <= 4; k++) { const v = max * k / 4; g += `<line x1="${pl}" x2="${W - pr}" y1="${y(v)}" y2="${y(v)}" stroke="#e3e9e6"/><text x="${pl - 6}" y="${y(v) + 4}" text-anchor="end" font-size="10" fill="#69766f">${Math.round(v)}</text>`; }
  const pts = vals.map((v, i) => `${x(i)},${y(v)}`).join(' ');
  const dots = vals.map((v, i) => `<circle cx="${x(i)}" cy="${y(v)}" r="3.5" fill="#0f7b5f"/>` + (v > 0 ? `<text x="${x(i)}" y="${y(v) - 8}" text-anchor="middle" font-size="10" fill="#16211d">${mm(v)}</text>` : '')).join('');
  const xl = labels.map((l, i) => `<text x="${x(i)}" y="${H - 10}" text-anchor="middle" font-size="10" fill="#69766f">${l}</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="최근 6개월 카드값(만원)">${g}<polyline points="${pts}" fill="none" stroke="#0f7b5f" stroke-width="2.5" stroke-linejoin="round"/>${dots}${xl}</svg><div class="muted">단위: 만원</div>`;
}

// 잔액 자동 계산: 전월 잔액 + 수입 − (전월 카드값 + 그 밖의 지출)
function calcBal() {
  const pm = monthAdd(led.m, -1), prev = (ledger[pm] || {}).balance;

  const hint = prevB != null ? `잔액 = 전월 잔액 ${mm(prevB)} + 수입 − 지출(전월 카드값 ${mm(cardP)} 포함)` : '전월 잔액이 없어 직접 입력해요.';
  const rows = (k, list) => list.map((r, i) => `<div class="crow"><input lang="ko" data-f="${k}N" data-i="${i}" list="${k}Names" value="${esc(r.n)}" placeholder="항목"><input data-f="${k}V" data-i="${i}" value="${esc(r.v)}" inputmode="decimal" placeholder="만원" style="max-width:90px;text-align:right"><button class="btn sm pinb ${r.pin ? 'on' : ''}" data-lpin="${k}:${i}" aria-pressed="${!!r.pin}" title="매월 고정 항목으로 저장/해제">고정</button><button class="x" data-ldel="${k}:${i}" aria-label="삭제">×</button></div>`).join('');
  openModal(`<h2>${led.m.replace('-', '년 ')}월 정보 입력 <span class="muted">(단위: 만원)</span></h2>
    <label class="fl">잔액<input data-f="balance" value="${esc(led.balance)}" inputmode="decimal" placeholder="예: 168.9"></label>
    <div class="bar" style="margin:-4px 0 8px"><span class="muted" style="flex:1">${esc(hint)}${prevB != null ? (led.balAuto ? ' · 자동 계산 중' : ' · 직접 입력됨') : ''}</span>${prevB != null ? '<button class="btn sm" data-balauto>자동 계산</button>' : ''}</div>
    <div class="fl">수입 항목${rows('in', led.income)}<button class="btn sm" data-ladd="in">+ 수입 항목</button></div>
    <div class="fl">지출 항목 <span class="muted">(카드값은 자동 계산)</span>${rows('ex', led.expense)}<button class="btn sm" data-ladd="ex">+ 지출 항목</button></div>
    <p class="muted" style="margin:0">'고정'을 켠 항목은 저장할 때 매월 고정 항목이 되어, 새 달을 열면 자동으로 채워져요.</p>
    <div class="fl">메모<textarea lang="ko" data-f="note" style="min-height:90px">${esc(led.note)}</textarea>
      <div class="bar" style="margin:6px 0 0"><button class="btn sm" data-memo="load">양식 불러오기</button><button class="btn sm" data-memo="save">지금 메모를 양식으로 저장</button></div></div>
    <p class="${msg ? '' : 'hide'}" style="color:var(${ok ? '--accent' : '--warn'})">${esc(msg || '')}</p>
    <div class="bar"><span class="sp"></span><button class="btn" data-close>닫기</button><button class="btn primary" id="ledSave">저장</button></div>`);
}
async function saveLedger() {
  const clean = l => l.filter(r => r.n.trim() || r.v.trim()).map(r => ({ n: r.n.trim() || '기타', v: num(r.v) }));
  const data = { balance: led.balance.trim() === '' ? null : num(led.balance), income: clean(led.income), expense: clean(led.expense), note: led.note.trim() };
  // 고정 항목: 켠 항목은 이름·금액 갱신, 끈 항목은 제거 (이 달에 없는 항목은 그대로 둠)
  const nf = { income: fixed.income.slice(), expense: fixed.expense.slice() };
  [['income', led.income], ['expense', led.expense]].forEach(([k, list]) => list.filter(r => r.n.trim() || r.v.trim()).forEach(r => {
    const n = r.n.trim() || '기타', i = nf[k].findIndex(f => f.n === n);
    if (r.pin) { if (i >= 0) nf[k][i].v = num(r.v); else nf[k].push({ n, v: num(r.v) }); } else if (i >= 0) nf[k].splice(i, 1);
  }));
  const e = (await sb.from('ledger').upsert({ month: led.m, data }, { onConflict: 'month' })).error
        || (await sb.from('settings').upsert({ key: 'fixed', value: nf }, { onConflict: 'key' })).error;
  if (e) return renderLedger('저장 실패: ' + e.message);
  ledger[led.m] = data; fixed = nf; closeModal(); refresh(); setStatus(`${led.m} 정보를 저장했어요.`);
}
async function memoTemplate(kind) {
  if (kind === 'load') { led.note = memoTpl; return renderLedger(memoTpl ? '양식을 불러왔어요.' : '저장된 양식이 없어요.', !!memoTpl); }
  const e = (await sb.from('settings').upsert({ key: 'memoTemplate', value: { text: led.note } }, { onConflict: 'key' })).error;
  if (e) return renderLedger('저장 실패: ' + e.message);
  memoTpl = led.note; renderLedger('메모 양식을 저장했어요. 새 달을 열면 이 양식이 채워져요.', true);
}

// ----- 이벤트 -----
document.querySelectorAll('.tab').forEach(b => b.onclick = () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x === b));
  $('app').classList.toggle('hide', b.dataset.t !== 'tx');
  $('dash').classList.toggle('hide', b.dataset.t !== 'dash');
  $('history').classList.toggle('hide', b.dataset.t !== 'history');
  $('ver').classList.toggle('hide', b.dataset.t === 'dash');
  if (b.dataset.t === 'dash' || b.dataset.t === 'history') drawDash();
});
// 좌우 스와이프로 탭 이동 (거래 내역 ↔ 대시보드 ↔ 전체 누적)
(() => {
  const order = ['tx', 'dash', 'history'];
  let sx = 0, sy = 0, st = 0, ok = false;
  const hScroll = el => { for (; el && el !== document.body; el = el.parentElement) { const o = getComputedStyle(el).overflowX; if ((o === 'auto' || o === 'scroll') && el.scrollWidth > el.clientWidth + 1) return true; } return false; };
  document.addEventListener('touchstart', e => {
    const t = e.touches[0]; sx = t.clientX; sy = t.clientY; st = Date.now();
    ok = e.touches.length === 1 && $('modal').classList.contains('hide') && !e.target.closest('input,textarea,select') && !hScroll(e.target);
  }, { passive: true });
  document.addEventListener('touchend', e => {
    if (!ok) return; ok = false;
    const t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
    if (Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 2 || Date.now() - st > 800) return;
    const cur = order.indexOf((document.querySelector('.tab.on') || {}).dataset?.t), nx = order[cur + (dx < 0 ? 1 : -1)];
    if (cur < 0 || !nx) return;
    document.querySelector(`.tab[data-t="${nx}"]`).click(); window.scrollTo(0, 0);
  }, { passive: true });
})();
$('addMonth').onclick = () => {
  const ms = Object.keys(ledger).sort(), def = monthAdd(ms.length ? ms[0] : nowMonth(), -1);
  openModal(`<h2>월 추가</h2>
    <label class="fl">추가할 년월<input id="pickMonth" type="month" value="${def}"></label>
    <p class="muted">이미 있는 달을 고르면 그 달을 수정해요.</p>
    <p id="pickMsg" class="hide" style="color:var(--warn)">년월을 선택하세요.</p>
    <div class="bar"><span class="sp"></span><button class="btn" data-close>취소</button><button class="btn primary" id="pickGo">다음</button></div>`);
};
$('catBtn').onclick = openCats;
$('manualAdd').onclick = openManualTx;
$('catMonth').onchange = e => { dashCatMonth = e.target.value; drawDash(); };
const openFromRow = e => { const m = e.target.dataset.m; if (m) openLedger(m); };
$('dashRows').onclick = openFromRow;
$('historyRows').onclick = openFromRow;
$('modal').onmousedown = e => { downOnBackdrop = e.target === $('modal'); };
$('modal').onclick = e => {
  const d = e.target.dataset;
  // 입력칸에서 드래그하다 바깥에서 놓아도 닫히지 않게: 눌렀을 때도 배경이었을 때만 닫음
  if ((e.target === $('modal') && downOnBackdrop) || 'close' in d) return closeModal();
  if (e.target === $('modal')) return;
  if (e.target.id === 'addCat') { const v = $('newCat').value.trim(); if (!v) return; if (catRows.some(r => r.name === v)) return renderCats('이미 있는 분류예요.'); catRows.push({ orig: null, name: v }); return renderCats(); }
  if (d.cdel) { catRows.splice(+d.cdel, 1); return renderCats(); }
  if (e.target.id === 'catSave') return saveCats();
  if (d.ladd) { led[d.ladd === 'in' ? 'income' : 'expense'].push({ n: '', v: '' }); return renderLedger(); }
  if (d.ldel) { const [k, i] = d.ldel.split(':'); led[k === 'in' ? 'income' : 'expense'].splice(+i, 1); return renderLedger(); }
  if (d.lpin) { const [k, i] = d.lpin.split(':'), r = led[k === 'in' ? 'income' : 'expense'][+i]; r.pin = !r.pin; return renderLedger(); }
  if ('balauto' in d) { led.balAuto = true; return renderLedger(); }
  if (d.memo) return memoTemplate(d.memo);
  if (e.target.id === 'ledSave') return saveLedger();
  if (e.target.id === 'pickGo') { const v = $('pickMonth').value; if (!/^\d{4}-\d{2}$/.test(v)) return $('pickMsg').classList.remove('hide'); closeModal(); return openLedger(v); }
  if (e.target.id === 'manualSave') return saveManualTx();
};
$('modal').oninput = e => {
  const d = e.target.dataset;
  if (d.ci != null) catRows[+d.ci].name = e.target.value;
  else if (d.f === 'balance') { led.balance = e.target.value; led.balAuto = false; }
  else if (d.f === 'note') led.note = e.target.value;
  else if (d.f) { const k = d.f.startsWith('in') ? 'income' : 'expense'; led[k][+d.i][d.f.endsWith('N') ? 'n' : 'v'] = e.target.value; autoBal(); }
};
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

if (sb) loadAll();
</script>
</body>
</html>
