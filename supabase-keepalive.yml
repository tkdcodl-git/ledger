# 가계부 Supabase 자동 접속 (무료 플랜 7일 미사용 일시정지 방지)
# 위치: 저장소의 .github/workflows/supabase-keepalive.yml
# 저장소 Settings → Secrets and variables → Actions 에 아래 두 값을 등록하세요.
#   SUPABASE_URL      예: https://xxxx.supabase.co
#   SUPABASE_ANON_KEY index.html 의 SUPABASE_ANON_KEY 값
name: Supabase keep-alive

on:
  schedule:
    - cron: "0 0 * * *"   # 매일 한국시간 오전 9시 (UTC 0시)
  workflow_dispatch:        # Actions 탭에서 직접 실행해 시험할 수 있음

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: 데이터베이스 읽기 (settings 표 1줄)
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          code=$(curl -s -o body.txt -w "%{http_code}" --max-time 30 \
            "$URL/rest/v1/settings?select=key&limit=1" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "HTTP $code"; cat body.txt; echo
          # 200이 아니면 실패로 표시 → GitHub가 메일로 알려줌
          [ "$code" = "200" ]
